name: Openers
description: Half an hour the evening before a hard day. Enough to wake the legs up, not enough to cost anything.

# A ramp may mix the two forms: start at half of FTP, finish at a number.
warmup: { duration: 8m, ramp: [50%, 180W] }

steps:
  - repeat: 2
    steps:
      # A repeat inside a repeat: three fast pedals, twice, rather than six written out.
      - repeat: 3
        steps:
          - { duration: 30s, power: 120%, cadence: [100, 110], name: Fast pedal }
          - { duration: 90s, power: 55%, name: Easy }
      - { duration: 3m, power: 50%, name: Easy }

  # No target at all: ERG releases, pick a gear and go.
  - { duration: 30s, power: free, name: Max effort }

cooldown: { duration: 5m, ramp: [55%, 40%] }
