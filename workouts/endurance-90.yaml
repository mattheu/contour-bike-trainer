name: 90 minute endurance
description: One long steady block at the top of zone 2. Nothing clever, and it is not meant to be.

# No ftp key: this one rides against whatever is in the profile.

warmup: { duration: 10m, ramp: [45%, 65%] }

steps:
  - duration: 1h10m
    power: 70%
    cadence: [85, 95]
    name: Endurance

# Watts rather than a percentage, because a spin down is a number you know, not a fraction of anything.
cooldown: { duration: 10m, power: 150W, name: Spin down }
