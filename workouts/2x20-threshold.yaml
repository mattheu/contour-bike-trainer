name: 2x20 threshold
description: Two long blocks at threshold with five easy between. The bread and butter of a build week.
ftp: 250 # this one is written in watts of its own; delete the line to ride it against your profile

warmup: { duration: 10m, ramp: [50%, 75%] }

steps:
  - repeat: 2
    steps:
      - { duration: 20m, power: 95%, cadence: 90, name: Threshold }
      - { duration: 5m, power: 55%, name: Easy }
  # No name on this one: the target already says everything there is to say.
  - { duration: 3m, power: 65% }

cooldown: { duration: 10m, ramp: [60%, 40%] }
